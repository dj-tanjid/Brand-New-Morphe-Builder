name: Build Modules

# Serialize publishing runs so two builds cannot select the same release tag.
concurrency:
  group: morphe-release-publishing-${{ github.repository }}
  cancel-in-progress: false
on:
  workflow_call:
    inputs:
      from_ci:
        type: boolean
        required: false
        default: true

  workflow_dispatch:

jobs:
  run:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Restore signing keystore
        env:
          MORPHE_KEYSTORE_BASE64: ${{ secrets.MORPHE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$MORPHE_KEYSTORE_BASE64"
          printf '%s' "$MORPHE_KEYSTORE_BASE64" | base64 --decode > Morphe.keystore
          chmod 600 Morphe.keystore

      - name: Update config
        if: ${{ inputs.from_ci }}
        run: |
          if git checkout origin/update build.md; then
            UPDATE_CFG=$(./build.sh config.toml --config-update)
            if [ "$UPDATE_CFG" ]; then
              echo "'$UPDATE_CFG'"
              echo "$UPDATE_CFG" > config.json
            fi
          fi

      - name: Get next APK version code
        id: next_ver_code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Releases are now per-app and no longer use numeric tags.
          RELEASE_COUNT=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].id' | wc -l)
          LAST_NUMERIC_TAG=$(gh release list --limit 1000 --json tagName --jq '[.[].tagName | select(test("^[0-9]+$")) | tonumber] | max // 0')
          CURRENT_MAX=$(( RELEASE_COUNT > LAST_NUMERIC_TAG ? RELEASE_COUNT : LAST_NUMERIC_TAG ))
          echo "NEXT_VER_CODE=$((CURRENT_MAX + 1))" >> "$GITHUB_OUTPUT"

      - name: Start API Solver in background
        run: docker run -d -p 8000:8000 ghcr.io/sarperavci/cloudflarebypassforscraping:latest

      - name: Build modules/APKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_VER_CODE: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          PYTHONUNBUFFERED: 1
          UPDATE_REPO_PAT: ${{ secrets.UPDATE_REPO_PAT }}
        run: |
          if [ -f "config.json" ]; then 
            stdbuf -o0 bash ./build.sh config.json
          else 
            stdbuf -o0 bash ./build.sh config.toml
          fi

      - name: Get output
        id: get_output
        run: |
          DELIM="$(openssl rand -hex 8)"
          echo "BUILD_LOG<<${DELIM}" >> "$GITHUB_OUTPUT"
          cat build.md >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"
          cp -f build.md build.tmp
      
      - name: Publish individual app releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          APK_FILES=(./build/*.apk)
          [ ${#APK_FILES[@]} -gt 0 ] || { echo "No APK files were produced"; exit 1; }

          BASE_TAG=$(TZ=Europe/Kyiv date +%d-%m-%Y)

          # Use a new tag for every publication. Check the remote Git refs,
          # not only the Releases list: an existing tag must never be reused.
          git fetch origin update
          git checkout -B update origin/update
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for APK in "${APK_FILES[@]}"; do
            FILE=${APK##*/}
            case "$FILE" in
              twitter-piko-newx-*.apk)
                APP_SLUG="twitter"
                APP_TITLE="Twitter (Piko-NewX)"
                PATCH_REPO="crimera/piko-newx"
                ;;
              instagram-sysadmindoc-*.apk)
                APP_SLUG="instagram"
                APP_TITLE="HushGram"
                PATCH_REPO="SysAdminDoc/HushGram"
                ;;
              instagram-piko-*.apk)
                APP_SLUG="instagram-piko"
                APP_TITLE="InstaPiko"
                PATCH_REPO="crimera/piko"
                ;;
              *)
                echo "Skipping APK without a configured per-app release: $FILE"
                continue
                ;;
            esac

            PATCH_VERSION=$(gh api "repos/$PATCH_REPO/releases/latest" --jq '.tag_name' 2>/dev/null || true)
            PATCH_VERSION="${PATCH_VERSION#v}"
            [ -n "$PATCH_VERSION" ] || PATCH_VERSION="unknown"
            RELEASE_TITLE="$APP_TITLE $PATCH_VERSION"

            BASE_APP_TAG="$BASE_TAG-$APP_SLUG"
            RELEASE_TAG="$BASE_APP_TAG"
            SUFFIX=0
            while git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; do
              SUFFIX=$((SUFFIX + 1))
              RELEASE_TAG="$BASE_APP_TAG-$SUFFIX"
            done

            NOTES="APK: $FILE
          App: $APP_TITLE
          Patch source: https://github.com/$PATCH_REPO/releases/tag/v$PATCH_VERSION"

            # Give this APK release its own commit timestamp, independent
            # of the patch-source commit date.
            git commit --allow-empty -m "Release $APP_SLUG: $RELEASE_TAG"
            git push origin HEAD:update
            RELEASE_COMMIT=$(git rev-parse HEAD)

            echo "Publishing $FILE as $RELEASE_TAG ($RELEASE_TITLE) from $RELEASE_COMMIT"
            gh release create "$RELEASE_TAG" "$APK" --target "$RELEASE_COMMIT" --title "$RELEASE_TITLE" --notes "$NOTES"
          done
      - name: Update modules changelog and update json
        id: update_config
        run: |
          git checkout -f update || git switch --discard-changes --orphan update
          cp -f build.tmp build.md
          get_update_json() {
            echo "{
            \"version\": \"$1\",
            \"versionCode\": ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }},
            \"zipUrl\": \"$2\",
            \"changelog\": \"https://raw.githubusercontent.com/$GITHUB_REPOSITORY/update/build.md\"
          }"
          }

          cd build || { echo "build folder not found"; exit 1; }
          for OUTPUT in *module*.zip; do
            [ "$OUTPUT" = "*module*.zip" ] && continue
            ZIP_S=$(unzip -p "$OUTPUT" module.prop)
            if ! UPDATE_JSON=$(echo "$ZIP_S" | grep updateJson); then continue; fi
            UPDATE_JSON="${UPDATE_JSON##*/}"
            VER=$(echo "$ZIP_S" | grep version=)
            VER="${VER##*=}"
            DLURL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.next_ver_code.outputs.RELEASE_TAG }}/${OUTPUT}"
            get_update_json "$VER" "$DLURL" >"../$UPDATE_JSON"
          done
          cd ..

          find . -name "*-update.json" | grep . || : >dummy-update.json

      - name: Commit module json changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          git add build.md *-update.json
      
          if ! git diff --cached --quiet; then
            git commit -m "Bump version ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}"
            git push origin HEAD:update
          else
            echo "no changes!"
          fi
