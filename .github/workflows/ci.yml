name: CI
on:
  workflow_dispatch:
  schedule:
    - cron: "10 23 * * *"
      timezone: "Asia/Dhaka"

jobs:
  check:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Should build?
        id: should_build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git checkout origin/update build.md; then
            echo "First time building! Building all enabled apps."
            echo "SHOULD_BUILD=1" >> "$GITHUB_OUTPUT"
            echo "USE_UPDATE_CONFIG=false" >> "$GITHUB_OUTPUT"
          else
            UPDATE_CFG=$(./build.sh config.toml --config-update)
            if [ -n "$UPDATE_CFG" ]; then
              printf '%s\n' "$UPDATE_CFG" > config.json
              echo "Apps with patch updates:"
              cat config.json
              echo "SHOULD_BUILD=1" >> "$GITHUB_OUTPUT"
              echo "USE_UPDATE_CONFIG=true" >> "$GITHUB_OUTPUT"
            else
              echo "No patch source updates found for any enabled apps."
              echo "SHOULD_BUILD=0" >> "$GITHUB_OUTPUT"
              echo "USE_UPDATE_CONFIG=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Upload filtered config
        if: steps.should_build.outputs.USE_UPDATE_CONFIG == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ci-update-config
          path: |
            config.json
            temp/skipped
          retention-days: 1

      - name: Clear older runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list -L400 --json databaseId -q '.[].databaseId' | tail -n+10 | xargs -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || :

    outputs:
      SHOULD_BUILD: ${{ steps.should_build.outputs.SHOULD_BUILD }}
      USE_UPDATE_CONFIG: ${{ steps.should_build.outputs.USE_UPDATE_CONFIG }}

  build:
    permissions: write-all
    needs: check
    uses: ./.github/workflows/build.yml
    if: ${{ needs.check.outputs.SHOULD_BUILD == 1 }}
    with:
      use-update-config: ${{ needs.check.outputs.USE_UPDATE_CONFIG == 'true' }}
    secrets: inherit
