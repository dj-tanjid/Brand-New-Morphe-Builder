enable-module-update = true # set this to false if you do not want to receive updates for the module
parallel-jobs = 1
remove-rv-integrations-checks = false # Automatically patch shared integration checks
# patcher-args = "--continue-on-error"

# add 'enabled = false' for not patching a specific app or remove it from the config
# see https://github.com/dj-tanjid/Morphe-DeVanced-Builder/blob/teejay/CONFIG.md for more detailed explanations

[YouTube-Morphe]
enabled = true
app-name = "YouTube"
patches-source = "github:MorpheApp/morphe-patches"
cli-source = "github:MorpheApp/morphe-desktop"
rv-brand = "Morphe"
build-mode = "both" # Options 'apk', 'module', or 'both'
arch = "arm64-v8a" # Options 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64', or 'universal'
# Stable Support #
# version = "auto" # 'auto', 'experimental', 'latest' or a version number
# Experimental Support #
# version = "21.28.207" # Version Supporting Miniplayer Type
version = "experimental"
# version = "21.36.45-SECONDARY"
dpi = "nodpi" # Options '120-640dpi', or 'nodpi'
excluded-patches = """\
    'Custom branding name for YouTube' \
    'Custom branding icon for YouTube' \
    'Custom branding' \
    """
patches-version = "dev" # Options 'latest', 'dev', or A specific version tag
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
github-dlurl = "https://github.com/dj-tanjid/AppRepo/releases/tag/com.google.android.youtube"
# archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"

